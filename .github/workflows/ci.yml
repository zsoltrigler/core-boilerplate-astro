# CI pipeline — economical by default (private downstream repos pay for Actions minutes).
#
# What runs where:
#   - Pull request:  lint, type-check, unit tests, build and e2e on Chromium only.
#                    Draft PRs are skipped until "ready for review". Lighthouse CI does
#                    NOT run on PRs unless the PR carries the `lighthouse` label.
#   - Push to main:  the same, with the full browser matrix (Chromium, Firefox, WebKit)
#                    and Lighthouse CI.
#   - A PR labelled `full-e2e`: the full browser matrix. A PR labelled `lighthouse`:
#     Lighthouse CI. A manual `workflow_dispatch` run: both.
#   - Release PR (`release-please--*` branch that only bumps the version files):
#     nothing runs — the code was already fully tested by the push to main it
#     was built from, and the next push to main tests the merge result.
#
# * The browser lists live in the two `E2E_*_BROWSERS` env vars below — the one place
#   to change them. See CONTRIBUTING.md → "CI and Actions minutes".
# * Docs-only PRs (Markdown outside src/ and public/, docs/, research_notes/,
#   reports/, references/) skip every step via the in-job `changes` step instead of a
#   workflow-level `paths-ignore`: the required "Type check & build" check still
#   reports (skipped counts as passing), so such PRs are never stuck on a pending
#   check. Pushes to main use a plain `paths-ignore` since no check is required there.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "research_notes/**"
      - "reports/**"
      - "references/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: read

# * One run per branch/PR; a newer push cancels the older run. Exceptions:
#   - main is never cancelled (every merged commit gets its full matrix run).
#   - a `labeled` event for any label other than `full-e2e`/`lighthouse` gets its own throwaway
#     group, so e.g. Dependabot's auto-labelling can't cancel a real in-flight run
#     (the job below is skipped for those events anyway).
concurrency:
  group: ci-${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'full-e2e' && github.event.label.name != 'lighthouse' && format('noop-{0}', github.run_id)) || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  E2E_PR_BROWSERS: '["chromium"]'
  E2E_FULL_BROWSERS: '["chromium","firefox","webkit"]'

jobs:
  build:
    name: Type check & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # * Drafts and label events other than `full-e2e`/`lighthouse` are skipped (a
    #   skipped job satisfies the required check).
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-e2e' || github.event.label.name == 'lighthouse'))
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
      matrix: ${{ steps.changes.outputs.matrix }}
      lighthouse: ${{ steps.changes.outputs.lighthouse }}

    steps:
      # * Decides (1) whether anything CI-relevant changed, (2) which e2e browsers
      #   to run and (3) whether Lighthouse CI runs. Runs before checkout so a
      #   docs-only or release PR costs only seconds.
      - name: Detect changes and e2e matrix
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          run=true
          matrix="$E2E_FULL_BROWSERS"
          lighthouse=true
          if [ "$EVENT" = "pull_request" ]; then
            matrix="$E2E_PR_BROWSERS"
            lighthouse=false
            case ",$LABELS," in *,full-e2e,*) matrix="$E2E_FULL_BROWSERS" ;; esac
            case ",$LABELS," in *,lighthouse,*) lighthouse=true ;; esac
            # ! Markdown under src/ or public/ can be site content (MDX/content
            #   collections), so it is never ignored.
            # * Fetched first on its own: if the API call fails the step fails (CI
            #   runs) instead of an empty list silently skipping CI.
            files=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" --jq '.[].filename')
            relevant=$(printf '%s\n' "$files" | awk '
              /^(docs|research_notes|reports|references)\// { next }
              /\.md$/ && !/^(src|public)\// { next }
              NF { print }')
            [ -z "$relevant" ] && run=false
            # * Release PR: skipped only if it touches nothing but the version files
            #   AND the package.json diff is nothing but the "version" line. The
            #   branch name alone is attacker-controllable (fork PRs), so it is
            #   never trusted by itself.
            case "$HEAD_REF" in
              release-please--*)
                other=$(printf '%s\n' "$files" | grep -vxE 'CHANGELOG\.md|\.release-please-manifest\.json|package\.json' || true)
                if [ -z "$other" ]; then
                  extra=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" \
                    --jq '.[] | select(.filename=="package.json") | .patch' \
                    | grep -E '^[+-]' | grep -vE '^[+-][[:space:]]*"version":' || true)
                  [ -z "$extra" ] && run=false
                fi
                ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "lighthouse=$lighthouse" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.changes.outputs.run == 'true'
        uses: actions/checkout@v7

      # * Version is read automatically from packageManager field in package.json
      - name: Setup pnpm
        if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.changes.outputs.run == 'true'
        run: pnpm lint

      - name: Type check
        if: steps.changes.outputs.run == 'true'
        run: pnpm exec astro check

      - name: Unit tests
        if: steps.changes.outputs.run == 'true'
        run: pnpm test

      # * Astro writes optimised images to node_modules/.astro/assets (content-
      #   addressed by source + transform), and re-uses them on the next build. On a
      #   cold runner every image is re-encoded from scratch (minutes for hundreds
      #   of images), so the directory is cached. The key changes with the assets,
      #   config, lockfile and Astro version; `restore-keys` restores the newest
      #   cache for the same Astro version on a partial match — stale entries are
      #   harmless because each file is keyed by its own content hash.
      - name: Get installed Astro version
        if: steps.changes.outputs.run == 'true'
        id: astro-version
        run: echo "version=$(node -p "require('astro/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache optimised images
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: ${{ runner.os }}-astro-assets-${{ steps.astro-version.outputs.version }}-${{ hashFiles('src/assets/**', 'public/**', 'astro.config.mjs', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-astro-assets-${{ steps.astro-version.outputs.version }}-

      - name: Build
        if: steps.changes.outputs.run == 'true'
        run: pnpm build

      # * The one and only build per run: the e2e jobs download this dist/ instead
      #   of building it inside Playwright's webServer startup window (where a cold
      #   build could exceed the timeout), once per browser.
      - name: Upload dist
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  # * Lighthouse CI is its own job so PRs don't pay for it by default: it runs on
  #   push to main, `workflow_dispatch`, and PRs labelled `lighthouse`. It boots
  #   `astro dev` (see .lighthouserc.cjs), so it needs no dist/. The required
  #   check is "Type check & build", which this job does not affect.
  lighthouse:
    name: Lighthouse CI
    needs: build
    if: needs.build.outputs.run == 'true' && needs.build.outputs.lighthouse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lighthouse CI
        run: pnpm exec lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

  # * One job per browser, run in parallel — CI runners are small (1 Playwright
  #   worker), so the three browser projects would otherwise run back to back.
  #   Each job also installs and caches only its own browser.
  e2e:
    name: End-to-end tests (${{ matrix.browser }})
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.build.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # * Resolved from node_modules (not just the package.json semver range) so the
      #   cache key always matches the version actually installed.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      # * Official Playwright-recommended pattern (https://playwright.dev/docs/ci#caching-browsers):
      #   cache the browser binaries themselves; on a hit, skip the ~250-500MB
      #   re-download and only run the (much faster) OS-dependency install below.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # ! Browser binaries came from cache, so only the apt-level OS deps
      #   (audio/video codecs, GTK, etc.) still need installing — skipping this
      #   entirely on cache hit would leave those missing on a fresh runner.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      # * playwright.config.ts's webServer previews the downloaded dist/ — no build here.
      - name: Run Playwright tests
        run: pnpm test:e2e:ci --project=${{ matrix.browser }}
