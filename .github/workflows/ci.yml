# CI pipeline — runs on every push and pull request targeting main.
# Installs dependencies, lints, type-checks, tests, builds, and runs Lighthouse CI.
# Any failing step blocks the PR from being merged.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type check & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # * Version is read automatically from packageManager field in package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec astro check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # * The one and only build per run: the e2e jobs download this dist/ instead
      #   of building it inside Playwright's webServer startup window (where a cold
      #   build could exceed the timeout), once per browser.
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

      - name: Lighthouse CI
        run: pnpm exec lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

  # * One job per browser, run in parallel — CI runners are small (1 Playwright
  #   worker), so the three browser projects would otherwise run back to back.
  #   Each job also installs and caches only its own browser.
  e2e:
    name: End-to-end tests (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # * Resolved from node_modules (not just the package.json semver range) so the
      #   cache key always matches the version actually installed.
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      # * Official Playwright-recommended pattern (https://playwright.dev/docs/ci#caching-browsers):
      #   cache the browser binaries themselves; on a hit, skip the ~250-500MB
      #   re-download and only run the (much faster) OS-dependency install below.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # ! Browser binaries came from cache, so only the apt-level OS deps
      #   (audio/video codecs, GTK, etc.) still need installing — skipping this
      #   entirely on cache hit would leave those missing on a fresh runner.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.browser }}

      # * playwright.config.ts's webServer previews the downloaded dist/ — no build here.
      - name: Run Playwright tests
        run: pnpm test:e2e:ci --project=${{ matrix.browser }}
